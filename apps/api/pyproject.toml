[project]
name = "civiclens-api"
version = "0.1.0"
description = "CivicLens decision-intelligence API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "av==18.1.0",
  "fastapi==0.141.1",
  "google-cloud-storage==3.14.1",
  "google-genai==2.23.0",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.11.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pyright==1.1.405",
  "pytest==8.4.2",
  "ruff==0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civiclens"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
