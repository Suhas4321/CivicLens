services:
  postgres:
    # postgis/postgis rather than plain postgres: the spatial reference tables use
    # geography columns and GiST indexes, so a server without PostGIS cannot run
    # migration 20260915_0002 at all. This image enables the extension on first
    # start, which is the Docker equivalent of infra/bootstrap-local-db.sh.
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: civiclens
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: civiclens
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civiclens -d civiclens"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - civiclens-postgres:/var/lib/postgresql/data

volumes:
  civiclens-postgres:

